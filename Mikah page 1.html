      <h1>LET THE<br>AIR IN.</h1>
      <p>After a long winter, even opening a window feels different.</p>

      <div class="outside">

      </div>
      <div class="fog">CONDENSATION / 08:42 AM</div>
      <div class="window-left"></div>
      <div class="window-right"></div>
